{% set name = "images-into-array" %}
{% set version = "3.0.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/images_into_array-{{ version }}.tar.gz"
  sha256: 34fe89c63f38be8e790ce5ccceb5e81801505bcb82dcd1c8bb98f2771f181da6

build:
  number: 1
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python {{ python_min }}
    - numpy
    - tqdm
    - opencv >=4.2.0
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - images_into_array

about:
  home: "https://github.com/sujitmandal/images-into-array"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Convert Multiple Images into a Array and Different Color Spaces into a Array"
  doc_url: https://sujitmandal.github.io/images-into-array/
  dev_url: https://github.com/sujitmandal/images-into-array

extra:
  recipe-maintainers:
    - sujitmandal
